name: casamento-producao

x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *logs
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *logs
    build:
      context: ./backend
      dockerfile: src/Casamento.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: ${DOMINIO:?defina DOMINIO no .env}
      ConnectionStrings__Principal: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Banco__AplicarMigrationsAoIniciar: "true"
      ProxyReverso__Redes__0: 10.214.0.0/24
      Jwt__ChaveAssinatura: ${JWT_CHAVE_ASSINATURA:?defina JWT_CHAVE_ASSINATURA no .env}
      DadosSensiveis__ChaveCifragem: ${DADOS_SENSIVEIS_CHAVE:?defina DADOS_SENSIVEIS_CHAVE no .env (openssl rand -base64 32)}
      Autenticacao__UrlFrontend: https://${DOMINIO}
      Email__Remetente: ${EMAIL_REMETENTE:?defina EMAIL_REMETENTE no .env}
      Email__NomeRemetente: ${EMAIL_NOME_REMETENTE:-Enlace}
      Email__Smtp__Host: ${SMTP_HOST:?defina SMTP_HOST no .env}
      Email__Smtp__Porta: ${SMTP_PORTA:-587}
      Email__Smtp__UsarSsl: ${SMTP_USAR_SSL:-true}
      Email__Smtp__Usuario: ${SMTP_USUARIO:-}
      Email__Smtp__Senha: ${SMTP_SENHA:-}
      ArmazenamentoArquivos__Diretorio: /var/lib/enlace/arquivos
    volumes:
      - arquivos-enlace:/var/lib/enlace/arquivos
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *logs
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORTA:-8090}:8080"
    depends_on:
      - api

networks:
  default:
    ipam:
      config:
        - subnet: 10.214.0.0/24

volumes:
  dados-postgres:
  arquivos-enlace:
