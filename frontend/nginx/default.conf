map $request_uri $cabecalho_robots {
    ~^/rsvp/ "noindex, nofollow";
    ~^/cronograma/ "noindex, nofollow";
    default "";
}

geo $realip_remote_addr $proxy_borda_confiavel {
    default 0;
    172.30.0.0/24 1;
}

map "$proxy_borda_confiavel:$http_x_forwarded_proto" $proto_encaminhado {
    default $scheme;
    "1:https" https;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    set_real_ip_from 172.30.0.0/24;
    real_ip_header X-Forwarded-For;

    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/cabecalhos-seguranca.conf;

    location /api/ {
        client_max_body_size 11m;
        set $destino_api http://api:8080;
        proxy_pass $destino_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $proto_encaminhado;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/cabecalhos-seguranca.conf;
    }

    location = /index.html {
        sub_filter_once on;
        sub_filter '__CSP_NONCE__' '$request_id';
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/cabecalhos-seguranca.conf;
    }

    location / {
        try_files $uri /index.html;
    }
}
