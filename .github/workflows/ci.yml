name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Restaurar dependências
        run: dotnet restore

      - name: Verificar formatação
        run: dotnet format --verify-no-changes --no-restore

      - name: Compilar
        run: dotnet build --configuration Release --no-restore

      - name: Verificar pacotes vulneráveis
        run: dotnet list package --vulnerable --include-transitive 2>&1 | tee vulneraveis.txt && ! grep -q "has the following vulnerable packages" vulneraveis.txt

      - name: Testar
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=resultados.trx"

  frontend:
    name: Frontend (Vue 3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificar tipos
        run: npm run type-check

      - name: Testar
        run: npm run test

      - name: Compilar
        run: npm run build-only

      - name: Auditar dependências
        run: npm audit --omit=dev --audit-level=high

  infra:
    name: Infra (deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recusar segredos com valor real nos arquivos de exemplo
        run: bash infra/testes/env-exemplo.test.sh

      - name: Gerar .env descartável do CI
        run: |
          senha=$(openssl rand -hex 32)
          jwt=$(openssl rand -base64 48 | tr -d '\n')
          cifra=$(openssl rand -base64 32 | tr -d '\n')
          for valor in "$senha" "$jwt" "$cifra"; do echo "::add-mask::$valor"; done
          sed -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$senha|" \
              -e "s|^JWT_CHAVE_ASSINATURA=.*|JWT_CHAVE_ASSINATURA=$jwt|" \
              -e "s|^DADOS_SENSIVEIS_CHAVE=.*|DADOS_SENSIVEIS_CHAVE=$cifra|" \
              .env.production.example > .env.ci

      - name: Validar compose de produção
        run: docker compose -f docker-compose.prod.yml --env-file .env.ci config --quiet

      - name: Recusar compose de produção sem variáveis obrigatórias
        run: |
          : > .env
          ! docker compose -f docker-compose.prod.yml config --quiet

      - name: Testar contexto Docker do frontend
        run: bash infra/testes/contexto-docker-web.test.sh

      - name: Construir imagem do frontend
        run: docker compose -f docker-compose.prod.yml --env-file .env.ci build web

      - name: Lint dos scripts
        run: shellcheck deploy.sh infra/deploy/localizar-deploy.sh infra/testes/deploy.test.sh infra/testes/localizar-deploy.test.sh infra/testes/proxy.test.sh infra/testes/contexto-docker-web.test.sh infra/testes/env-exemplo.test.sh

      - name: Testar deploy.sh
        run: bash infra/testes/deploy.test.sh

      - name: Testar localização do deploy na VPS
        run: bash infra/testes/localizar-deploy.test.sh

      - name: Testar cadeia de proxies
        run: bash infra/testes/proxy.test.sh

      - name: Validar vhost do nginx do host
        run: |
          DOMINIO=celebri.exemplo.com.br WEB_PORTA=8090 envsubst '$DOMINIO $WEB_PORTA' \
            < infra/nginx/celebri.conf.template > celebri.conf
          docker run --rm -v "$PWD/celebri.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

      - name: Validar nginx do container web
        run: >-
          docker run --rm
          --add-host api:127.0.0.1
          -v "$PWD/frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"
          -v "$PWD/frontend/nginx/cabecalhos-seguranca.conf:/etc/nginx/snippets/cabecalhos-seguranca.conf:ro"
          nginxinc/nginx-unprivileged:1.27-alpine
          nginx -t
